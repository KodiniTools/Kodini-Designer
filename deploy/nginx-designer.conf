# nginx-Location-Blöcke für den Kodini Designer (Parallelbetrieb unter /designer).
#
# In den bestehenden HAUPTSERVER-Block (server_name kodinitools.com; listen 443 …)
# einfügen – VOR die generischen Astro-Locations (location = / usw.), z. B. direkt
# neben den vorhandenen /admin-Blöcken. Danach:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Der Designer-Dienst läuft lokal auf 127.0.0.1:9030 (siehe kodini-designer.service).
# Der /uploads-Block aus der Admin-Einrichtung bleibt unverändert und wird
# mitbenutzt (gleicher Webroot).

# --- Designer-API -> Node-Dienst ---
location ^~ /designer/api/ {
    proxy_pass http://127.0.0.1:9030/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Große Medien-Uploads beim Veröffentlichen (Videos):
    client_max_body_size 2G;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}

# --- Designer-Frontend + Vorschau (/designer/preview/…) -> Node-Dienst ---
location ^~ /designer/ {
    proxy_pass http://127.0.0.1:9030/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}
