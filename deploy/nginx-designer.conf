# nginx-Location-Blöcke für den Kodini Designer (Adminbereich unter /admin).
#
# Diese Blöcke in den bestehenden HAUPTSERVER-Block
# (server_name kodinitools.com; listen 443 ...) einfügen — WICHTIG:
# VOR die generischen Astro-Locations (location = / usw.), damit "^~ /admin"
# zuerst greift. Danach:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Der Admin-Node-Dienst läuft lokal auf 127.0.0.1:9020 (siehe kodini-designer.service).
# Muster analog zum bestehenden traffic-dashboard-Block.

# --- Admin-API -> Node-Dienst ---
location ^~ /admin/api/ {
    proxy_pass http://127.0.0.1:9020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Große Medien-Uploads beim Veröffentlichen (Videos):
    client_max_body_size 2G;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Nicht cachen / nicht indexieren
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}

# --- Admin-Frontend (Login-/Overlay-Bundle) -> Node-Dienst ---
location ^~ /admin/ {
    proxy_pass http://127.0.0.1:9020/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}

# --- Öffentlich ausgelieferte Upload-Medien (Bilder/Videos) ---
# Liegen im Webroot unter uploads/ und werden beim Veröffentlichen befüllt.
# Wichtig: KEINE Skript-Ausführung in diesem Ordner (nur statische Auslieferung).
location ^~ /uploads/ {
    alias /var/www/kodinitools.com/uploads/;
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Sicherheitshalber dynamische Endungen im Upload-Ordner blockieren:
    location ~* \.(php|phtml|phar|cgi|pl|py|asp|aspx|jsp|sh)$ { return 404; }
}
